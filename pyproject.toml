[project]
name = "frontier-mcp"
version = "0.1.0"
description = "Frontier research MCP — pulls current state-of-the-art from arXiv (papers), GitHub (implementations), and HuggingFace (models/datasets) so an agent reasons from live primary material, not a training cutoff."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "arxiv>=2.1",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_mcp"]

[project.scripts]
frontier-mcp = "frontier_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
